<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boda Links</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui}canvas{position:fixed;inset:0;pointer-events:none;z-index:0;display:none}.wrap{max-width:500px;margin:auto;padding:16px;position:relative;z-index:1}.logo{text-align:center;font-size:34px;font-weight:900}.logo span{color:#00e5ff}.counter{background:linear-gradient(90deg,#ff0055,#ffaa00);padding:12px;border-radius:14px;text-align:center;font-weight:900;margin:12px 0}.card{background:#141414;border:1px solid #333;border-radius:18px;padding:16px}.row{display:flex;align-items:center;gap:10px;background:#1c1c1c;padding:10px;margin:8px 0;border-radius:14px}.row img{width:40px;height:40px;border-radius:10px;background:#fff;padding:3px}.row b{flex:1}input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#0a0a0a;color:#fff;margin:6px 0}.btn{background:#00e5ff;color:#000;border:0;padding:15px;border-radius:16px;width:100%;font-weight:900;font-size:17px;margin-top:10px;cursor:pointer}.btn2{background:#fff}.link{display:flex;align-items:center;gap:12px;background:#1a1a1a;padding:15px;border-radius:16px;margin:10px 0;color:#fff;text-decoration:none;font-weight:800}.link img{width:36px;height:36px;border-radius:8px;background:#fff;padding:2px}.avatar{width:110px;height:110px;border-radius:50%;border:3px solid #00e5ff;display:block;margin:12px auto;background:#222;text-align:center;line-height:110px;font-size:50px;font-weight:900;object-fit:cover}.shake{animation:shk .4s infinite}@keyframes shk{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-3deg)}50%{transform:translateX(6px) rotate(3deg)}100%{transform:translateX(0)}}.shakeScreen{animation:shk2 .3s}@keyframes shk2{0%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}100%{transform:translateX(0)}}.vibe{border:1px solid #00e5ff;background:#0a1a20}.vibe b{color:#00e5ff}</style></head><body><canvas id="fx"></canvas><div class="wrap" id="app"></div><script>
const SOCIALS=[{id:'tiktok',name:'TikTok',logo:'https://cdn.simpleicons.org/tiktok/ffffff'},{id:'instagram',name:'Instagram',logo:'https://cdn.simpleicons.org/instagram/E1306C'},{id:'facebook',name:'Facebook',logo:'https://cdn.simpleicons.org/facebook/1877F2'},{id:'whatsapp',name:'WhatsApp',logo:'https://cdn.simpleicons.org/whatsapp/25D366'},{id:'youtube',name:'YouTube',logo:'https://cdn.simpleicons.org/youtube/FF0000'},{id:'snapchat',name:'Snapchat',logo:'https://cdn.simpleicons.org/snapchat/FFFC00'},{id:'telegram',name:'Telegram',logo:'https://cdn.simpleicons.org/telegram/26A5E4'},{id:'x',name:'X - Twitter',logo:'https://cdn.simpleicons.org/x/ffffff'}];
const VIBES=[{id:'music',name:'Music - اغنية تشتغل',icon:'🎵',desc:'اغنية تشتغل لما حد يفتح صفحتك'},{id:'shakePhoto',name:'Shake Photo - صورتك تتهز',icon:'📸',desc:'صورتك تفضل تتهز'},{id:'snow',name:'Snow - تلج بينزل',icon:'❄️',desc:'تلج ابيض بينزل من فوق'},{id:'fire',name:'Fire - نار بتنزل',icon:'🔥',desc:'نار برتقالي بتنزل احتفال'},{id:'electric',name:'Electric - كهربا',icon:'⚡',desc:'الشاشة تتهز وصوت ززززز لما حد يدوس'},{id:'video',name:'Video - فيديو',icon:'🎬',desc:'فيديو يشتغل في صفحتك'}];
function electric(){try{if(navigator.vibrate)navigator.vibrate([80,40,80,40,120])}catch(e){}try{let AC=new (window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=180;g.gain.value=0.1;o.connect(g);g.connect(AC.destination);o.start();setTimeout(()=>{o.stop();AC.close()},350)}catch(e){}document.body.classList.remove('shakeScreen');void document.body.offsetWidth;document.body.classList.add('shakeScreen')}
const cv=document.getElementById('fx'),ctx=cv.getContext('2d');function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();let ps=[],mode='fire';for(let i=0;i<90;i++)ps.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*3+2,sp:Math.random()*2+1});function startFX(m){mode=m;cv.style.display='block';(function loop(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.sp;if(p.y>cv.height){p.y=-10;p.x=Math.random()*innerWidth}if(mode==='snow'){ctx.fillStyle='#fff'}else if(mode==='fire'){ctx.fillStyle=Math.random()>0.5?'#ff5500':'#ffaa00'}else{ctx.fillStyle='#fff'}ctx.shadowBlur=10;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()});requestAnimationFrame(loop)})()}
function getData(){try{let h=location.hash.slice(1);if(!h)return null;return JSON.parse(decodeURIComponent(h))}catch(e){return null}}
let cnt=parseInt(localStorage.getItem('boda_count')||'1247');cnt++;localStorage.setItem('boda_count',cnt);
function renderProfile(d){
let eff=d.effects||{};if(eff.snow)startFX('snow');else if(eff.fire)startFX('fire');
let links='';SOCIALS.forEach(s=>{if(d.links&&d.links[s.id]){let u=d.links[s.id];if(!u.startsWith('http'))u='https://'+u;links+=`<a class="link" href="${u}" target="_blank"><img src="${s.logo}">${s.name}<span style="margin-left:auto">↗</span></a>`}});
let avCls=eff.shakePhoto?'avatar shake':'avatar';let av=d.photo?`<img class="${avCls}" src="${d.photo}">`:`<div class="${avCls}">${(d.name||'B')[0].toUpperCase()}</div>`;
let musicHtml=eff.music?`<audio controls autoplay loop style="width:100%;margin:10px 0"><source src="${d.musicLink||'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'}"></audio><p style="text-align:center;font-size:12px">🎵 Music Playing</p>`:'';let videoHtml=eff.video&&d.videoLink?`<video controls autoplay muted loop style="width:100%;border-radius:16px;margin:10px 0"><source src="${d.videoLink}"></video>`:'';let btnClick=eff.electric?"electric();":"";
document.getElementById('app').innerHTML=`<div class="logo">BODA <span>LINKS</span></div><div class="counter">🔥 ${cnt} People Used Boda Links</div><div style="font-size:55px;text-align:center">✅</div><h2 style="text-align:center">Tamam! Your Page Is Ready 🎉</h2>${av}<h1 style="text-align:center">${d.name}</h1><p style="text-align:center;color:#bbb">${d.bio||''}</p>${musicHtml}${videoHtml}${links}<button class="btn btn2" onclick="${btnClick}navigator.clipboard.writeText(location.href);alert('Copied!')">⚡ Copy Link</button><button class="btn" onclick="${btnClick}location.hash='';location.reload()">⚡ Create Your Page</button>`}
function showBuilder(){
let rows=SOCIALS.map(s=>`<div class="row"><input type="checkbox" style="width:22px;height:22px" onchange="electric();document.getElementById('in-${s.id}').style.display=this.checked?'block':'none'"><img src="${s.logo}"><b>${s.name}</b></div><input id="in-${s.id}" style="display:none" placeholder="Put your ${s.name} link">`).join('');
let vibes=VIBES.map(v=>`<div class="row vibe"><input type="checkbox" id="v-${v.id}" style="width:22px;height:22px" onchange="electric()"><span style="font-size:26px">${v.icon}</span><div><b>${v.name}</b><div style="font-size:12px;color:#aaa">${v.desc}</div></div></div>`).join('');
document.getElementById('app').innerHTML=`<div class="logo">BODA <span>LINKS</span></div><p style="text-align:center;color:#aaa">Your Links - One Page - Free</p><div class="counter">🔥 ${cnt} People Used Boda Links</div><div class="card"><h2 style="text-align:center">Create Your Page</h2><label>Your Name</label><input id="name" placeholder="Ex: Boda"><label>Bio</label><input id="bio" placeholder="Ex: All my links here"><label>Your Photo Link (optional)</label><input id="photo" placeholder="Paste photo link"><label style="font-weight:900;display:block;margin-top:14px">1. Choose Your Socials - اختار التطبيقات:</label>${rows}<label style="font-weight:900;display:block;margin-top:16px;color:#00e5ff">2. Choose Your Vibe - اختار الإثارة 🔥:</label><p style="font-size:12px;color:#aaa">اختار اللي عايزه من الإثارة، هتشتغل في صفحتك</p>${vibes}<label>Music Link (لو اخترت اغنية - حط لينك الاغنية)</label><input id="musicLink" placeholder="Paste music link - optional"><label>Video Link (لو اخترت فيديو - حط لينك الفيديو)</label><input id="videoLink" placeholder="Paste video link - optional"><button class="btn" onclick="electric();makePage()">⚡ Create My Page</button><div id="out"></div></div>`}
function makePage(){let name=document.getElementById('name').value||'My Page';let bio=document.getElementById('bio').value||'';let photo=document.getElementById('photo').value||'';let musicLink=document.getElementById('musicLink').value||'';let videoLink=document.getElementById('videoLink').value||'';let links={};SOCIALS.forEach(s=>{let v=document.getElementById('in-'+s.id).value.trim();if(v)links[s.id]=v});let effects={};VIBES.forEach(v=>{effects[v.id]=document.getElementById('v-'+v.id).checked});let hash='#'+encodeURIComponent(JSON.stringify({name,bio,photo,links,effects,musicLink,videoLink}));let full=location.origin+location.pathname+hash;document.getElementById('out').innerHTML=`<div style="background:#0f2a1a;padding:12px;border-radius:12px;margin-top:12px;text-align:center"><div style="font-size:40px">✅</div><b>Tamam! Done!</b><p style="word-break:break-all;font-size:12px">${full}</p><button class="btn btn2" onclick="electric();navigator.clipboard.writeText('${full}');alert('Copied!')">⚡ Copy Link</button><button class="btn" onclick="electric();location.hash='${hash}';location.reload()">⚡ Open My Page</button></div>`}
let d=getData();if(d)renderProfile(d);else showBuilder();
</script></body></html>
