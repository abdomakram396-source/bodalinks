<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحتي - بودا</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff;min-height:100vh;padding:15px}
.top{max-width:450px;margin:auto;text-align:center}
.logo{font-size:28px;font-weight:900;margin:10px 0 2px}
.logo span{color:#25D366}
.sub{color:#aaa;font-size:13px;margin-bottom:15px}
.progress{display:flex;gap:5px;margin:10px 0 20px}
.progress div{flex:1;height:6px;background:#333;border-radius:10px;overflow:hidden}
.progress div.active{background:#25D366}
.card{background:#1a1a1a;border-radius:18px;padding:15px;margin-bottom:15px;text-align:right}
.card h3{font-size:17px;margin-bottom:10px}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.app{background:#222;border:2px solid #333;border-radius:14px;padding:12px;text-align:center;cursor:pointer}
.app.selected{border-color:#25D366;background:#123524}
.app .emo{font-size:30px}
.app b{display:block;margin-top:5px;font-size:14px}
.app small{color:#aaa;font-size:11px}
.effects{display:flex;flex-direction:column;gap:10px}
.eff{background:#222;border:2px solid #333;border-radius:14px;padding:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.eff.selected{border-color:#FE2C55;background:#2a1220}
.eff b{font-size:15px}
.eff small{color:#aaa;display:block;font-size:12px}
input[type=text]{width:100%;background:#222;border:1px solid #333;color:#fff;padding:13px;border-radius:12px;margin-bottom:10px;font-size:14px;direction:ltr;text-align:left}
input[type=text]::placeholder{color:#777}
.btn{width:100%;background:#25D366;color:#fff;border:none;padding:15px;border-radius:25px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:5px}
.btn2{background:#333;color:#fff}
.btn:disabled{background:#333;color:#888}
.hidden{display:none}
.myPage{text-align:center}
.avatar{width:110px;height:110px;border-radius:50%;background:linear-gradient(45deg,#25D366,#FE2C55);display:flex;align-items:center;justify-content:center;font-size:50px;margin:15px auto;border:3px solid #fff}
.linkBtn{display:block;background:#fff;color:#000;text-decoration:none;padding:15px;border-radius:15px;margin:10px 0;font-weight:bold;font-size:16px}
.linkBtn.tiktok{background:#000;color:#fff;border:1px solid #333}
.linkBtn.insta{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff}
.linkBtn.whats{background:#25D366;color:#fff}
.linkBtn.face{background:#1877F2;color:#fff}
.linkBtn.you{background:#FF0000;color:#fff}
.badge{display:inline-block;background:#222;padding:6px 12px;border-radius:20px;font-size:12px;margin:3px}
</style>
</head>
<body>
<div class="top">
<div class="logo">بودا <span>BOODA</span></div>
<div class="sub" id="stepText">الخطوة 1 من 3 - اختار تطبيقاتك</div>
<div class="progress"><div class="active" id="p1"></div><div id="p2"></div><div id="p3"></div></div>

<!-- الصفحة الاولى: اختار التطبيقات -->
<div id="page1">
<div class="card"><h3>1- اختار التطبيقات اللي عايزها في صفحتك 👇</h3>
<div class="apps" id="appsList"></div>
</div>
<button class="btn" id="to2" disabled onclick="go2()">التالي ➜</button>
</div>

<!-- الصفحة التانية: اختار الاثارة -->
<div id="page2" class="hidden">
<div class="card"><h3>2- اختار الاثارة والشكل 🔥</h3>
<div class="effects" id="effectsList"></div>
</div>
<div style="display:flex;gap:8px"><button class="btn btn2" style="flex:1" onclick="back1()">⬅ رجوع</button><button class="btn" style="flex:2" onclick="go3()">التالي ➜</button></div>
</div>

<!-- الصفحة التالتة: حط اللينكات -->
<div id="page3" class="hidden">
<div class="card"><h3>3- حط لينكاتك هنا 🔗</h3>
<p style="color:#aaa;font-size:13px;margin-bottom:12px">حط لينك كل تطبيق اخترته، واللي مش عايزه سيبه فاضي</p>
<div id="linksBox"></div>
</div>
<div style="display:flex;gap:8px"><button class="btn btn2" style="flex:1" onclick="back2()">⬅ رجوع</button><button class="btn" style="flex:2" onclick="finish()">تأكيد واعرض صفحتي ✅</button></div>
</div>

<!-- الصفحة الاخيرة: صفحتك -->
<div id="pageFinal" class="hidden">
<div class="myPage">
<div class="avatar">👑</div>
<h2>بودا BOODA</h2>
<p style="color:#aaa;font-size:13px;margin:5px 0">هيبتنا مرفوعة وعلم 👑</p>
<div id="myBadges"></div>
<div id="myLinks"></div>
<button class="btn btn2" onclick="editAgain()">✏️ تعديل صفحتي</button>
<button class="btn" onclick="copyPage()">📋 انسخ لينك صفحتي</button>
<p id="copyMsg" style="color:#25D366;font-size:13px;margin-top:8px"></p>
</div>
</div>

</div>
<script>
let apps=[
{id:'tiktok',name:'تيك توك',emo:'🎵',desc:'فيديوهاتي'},
{id:'insta',name:'انستجرام',emo:'📸',desc:'صوري'},
{id:'whats',name:'واتساب',emo:'💬',desc:'كلمني'},
{id:'face',name:'فيسبوك',emo:'👍',desc:'صفحتي'},
{id:'you',name:'يوتيوب',emo:'▶️',desc:'فيديوهات طويلة'},
{id:'tele',name:'تليجرام',emo:'✈️',desc:'قناتي'},
];
let effects=[
{id:'smoke',name:'💨 دخان خفيف',desc:'هادي وشيك'},
{id:'fire',name:'🔥 نار',desc:'حماسي وقوي'},
{id:'glitter',name:'✨ لمعة',desc:'بيلمع ويلفت'},
{id:'shake',name:'📳 هزة',desc:'بيتهز مع الموسيقى'},
{id:'calm',name:'😎 هادي من غير اثارة',desc:'نضيف وبسيط'},
];
let selectedApps=[];
let selectedEffect='smoke';

let appsList=document.getElementById('appsList');
apps.forEach(a=>{
  let d=document.createElement('div'); d.className='app'; d.id='app-'+a.id;
  d.innerHTML=`<div class="emo">${a.emo}</div><b>${a.name}</b><small>${a.desc}</small>`;
  d.onclick=()=>{
    if(selectedApps.includes(a.id)){ selectedApps=selectedApps.filter(x=>x!==a.id); d.classList.remove('selected'); }
    else{ selectedApps.push(a.id); d.classList.add('selected'); }
    document.getElementById('to2').disabled = selectedApps.length===0;
    document.getElementById('to2').innerText = selectedApps.length? `التالي ➜ (${selectedApps.length})` : 'التالي ➜';
  };
  appsList.appendChild(d);
});

let effectsList=document.getElementById('effectsList');
effects.forEach(e=>{
  let d=document.createElement('div'); d.className='eff'+(e.id==='smoke'?' selected':''); d.id='eff-'+e.id;
  d.innerHTML=`<div><b>${e.name}</b><small>${e.desc}</small></div><div>${e.id==='smoke'?'✅':''}</div>`;
  d.onclick=()=>{
    selectedEffect=e.id;
    document.querySelectorAll('.eff').forEach(el=>{el.classList.remove('selected'); el.querySelector('div:last-child').innerText='';});
    d.classList.add('selected'); d.querySelector('div:last-child').innerText='✅';
  };
  effectsList.appendChild(d);
});

function go2(){ document.getElementById('page1').classList.add('hidden'); document.getElementById('page2').classList.remove('hidden'); document.getElementById('stepText').innerText='الخطوة 2 من 3 - اختار الاثارة'; document.getElementById('p2').classList.add('active'); }
function back1(){ document.getElementById('page2').classList.add('hidden'); document.getElementById('page1').classList.remove('hidden'); document.getElementById('stepText').innerText='الخطوة 1 من 3 - اختار تطبيقاتك'; document.getElementById('p2').classList.remove('active'); }
function go3(){
  document.getElementById('page2').classList.add('hidden'); document.getElementById('page3').classList.remove('hidden');
  document.getElementById('stepText').innerText='الخطوة 3 من 3 - حط لينكاتك';
  document.getElementById('p3').classList.add('active');
  let box=document.getElementById('linksBox'); box.innerHTML='';
  selectedApps.forEach(id=>{
    let a=apps.find(x=>x.id===id);
    box.innerHTML+=`<label style="font-size:13px;display:block;margin-bottom:5px">${a.emo} لينك ${a.name}</label><input type="text" id="link-${id}" placeholder="مثال: https://tiktok.com/@booda">`;
  });
}
function back2(){ document.getElementById('page3').classList.add('hidden'); document.getElementById('page2').classList.remove('hidden'); document.getElementById('stepText').innerText='الخطوة 2 من 3 - اختار الاثارة'; document.getElementById('p3').classList.remove('active'); }
function finish(){
  document.getElementById('page3').classList.add('hidden'); document.getElementById('pageFinal').classList.remove('hidden');
  document.getElementById('stepText').innerText='صفحتك جاهزة 🎉';
  let effName=effects.find(e=>e.id===selectedEffect).name;
  document.getElementById('myBadges').innerHTML=`<span class="badge">${effName}</span> <span class="badge">👑 بودا</span>`;
  let linksHtml='';
  selectedApps.forEach(id=>{
    let a=apps.find(x=>x.id===id);
    let val=document.getElementById('link-'+id).value.trim();
    if(!val) val='#';
    linksHtml+=`<a class="linkBtn ${id}" href="${val}" target="_blank">${a.emo} ${a.name} - دوس هنا</a>`;
  });
  document.getElementById('myLinks').innerHTML=linksHtml;
  window.scrollTo(0,0);
}
function editAgain(){ document.getElementById('pageFinal').classList.add('hidden'); document.getElementById('page1').classList.remove('hidden'); document.getElementById('stepText').innerText='الخطوة 1 من 3 - اختار تطبيقاتك'; }
function copyPage(){ document.getElementById('copyMsg').innerText='اتنسخ ✅ ابعته لصحابك'; }
</script>
</body>
</html>
