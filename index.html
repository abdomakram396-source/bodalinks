<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boda Links</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:system-ui;background:#000;overflow-x:hidden}body::before{content:'';position:fixed;inset:0;background:linear-gradient(45deg,#ff0055,#ffaa00,#00e5ff,#00ff88,#a100ff,#ff0055);background-size:400% 400%;animation:bg 8s linear infinite;opacity:.25;z-index:0}@keyframes bg{0%{background-position:0% 50%}100%{background-position:400% 50%}}canvas{position:fixed;inset:0;pointer-events:none;z-index:1;display:none}.wrap{max-width:520px;margin:auto;padding:16px;position:relative;z-index:2}.logo{text-align:center;font-size:38px;font-weight:900;text-shadow:0 0 20px #00e5ff,0 0 40px #ff0055}.logo span{color:#00e5ff}.counter{background:linear-gradient(90deg,#ff0055,#ffaa00,#00ff88);background-size:200%;animation:bg 3s linear infinite;padding:13px;border-radius:14px;text-align:center;font-weight:900;margin:12px 0;box-shadow:0 0 25px #ff0055}.card{background:rgba(20,20,20,.92);border:2px solid #00e5ff;border-radius:20px;padding:16px;box-shadow:0 0 30px #00e5ff44}.row{display:flex;align-items:center;gap:10px;background:#1c1c1c;padding:12px;margin:8px 0;border-radius:14px;border:1px solid #333}.row img{width:42px;height:42px;border-radius:10px;background:#fff;padding:3px}.row b{flex:1}.btn{background:linear-gradient(90deg,#00e5ff,#00ff88);color:#000;border:0;padding:16px;border-radius:16px;width:100%;font-weight:900;font-size:18px;margin-top:10px;cursor:pointer;box-shadow:0 0 20px #00e5ff}.btn2{background:#fff}.link{display:flex;align-items:center;gap:12px;padding:15px;border-radius:16px;margin:10px 0;color:#fff;text-decoration:none;font-weight:900;font-size:17px;border:2px solid #fff;box-shadow:0 0 18px currentColor}.link img{width:38px;height:38px;border-radius:8px;background:#fff;padding:2px}.avatar{width:130px;height:130px;border-radius:50%;border:4px solid #00ff88;display:block;margin:12px auto;background:#222;text-align:center;line-height:130px;font-size:55px;font-weight:900;object-fit:cover;box-shadow:0 0 30px #00ff88}.phrase{overflow:hidden;white-space:nowrap;margin:10px 0}.phrase span{display:inline-block;color:#00ff88;text-shadow:0 0 10px #00ff88,0 0 20px #00ff88;font-weight:900;font-size:18px;animation:move 6s linear infinite}@keyframes move{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #444;background:#0a0a0a;color:#fff;margin:6px 0}.elecBtn{background:linear-gradient(90deg,#ffe600,#ff5500);font-size:22px;box-shadow:0 0 30px #ffe600}.flash{position:fixed;inset:0;background:#fff;z-index:99;display:none;pointer-events:none}.flashShow{display:block;animation:fl .4s}@keyframes fl{0%{opacity:1}100%{opacity:0}}.bigBolt{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:120px;z-index:100;display:none;text-shadow:0 0 30px #ffe600}.upload{border:2px dashed #00e5ff;padding:14px;border-radius:14px;text-align:center;background:#0a1a20}.preview{width:110px;height:110px;border-radius:50%;object-fit:cover;display:none;margin:10px auto;border:3px solid #00ff88;box-shadow:0 0 20px #00ff88}</style></head><body><div class="flash" id="flash"></div><div class="bigBolt" id="bolt">⚡</div><canvas id="fx"></canvas><div class="wrap" id="app"></div><script>
const SOCIALS=[{id:'tiktok',name:'TikTok',logo:'https://cdn.simpleicons.org/tiktok/ffffff',color:'#ff0055'},{id:'instagram',name:'Instagram',logo:'https://cdn.simpleicons.org/instagram/E1306C',color:'#ff2a9d'},{id:'facebook',name:'Facebook',logo:'https://cdn.simpleicons.org/facebook/1877F2',color:'#1877F2'},{id:'whatsapp',name:'WhatsApp',logo:'https://cdn.simpleicons.org/whatsapp/25D366',color:'#25D366'},{id:'youtube',name:'YouTube',logo:'https://cdn.simpleicons.org/youtube/FF0000',color:'#FF0000'},{id:'snapchat',name:'Snapchat',logo:'https://cdn.simpleicons.org/snapchat/FFFC00',color:'#FFFC00'},{id:'telegram',name:'Telegram',logo:'https://cdn.simpleicons.org/telegram/26A5E4',color:'#26A5E4'},{id:'x',name:'X - Twitter',logo:'https://cdn.simpleicons.org/x/ffffff',color:'#ffffff'}];
const PHRASES=["I AM THE KING 👑","BODA IS HERE 🔥","NO ONE LIKE ME 💪","BORN TO BE LEGEND ✨","TOP OF THE GAME 🏆","I RUN THIS CITY ⚡","LEGEND NEVER DIES 🔥","KING OF LINKS 👑","WATCH ME SHINE 💎","I AM UNSTOPPABLE 🚀"];
const VIBES=[{id:'music',name:'Music - اغنية',icon:'🎵'},{id:'shakePhoto',name:'Shake Photo - صورتك تتهز',icon:'📸'},{id:'snow',name:'Snow - تلج',icon:'❄️'},{id:'fire',name:'Fire - نار',icon:'🔥'},{id:'electric',name:'Electric - كهربا',icon:'⚡'},{id:'video',name:'Video - فيديو',icon:'🎬'}];
let userPhoto='';
function boomElectric(){try{if(navigator.vibrate)navigator.vibrate([100,50,100,50,200])}catch(e){}try{let AC=new (window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=220;g.gain.value=0.2;o.connect(g);g.connect(AC.destination);o.start();setTimeout(()=>{o.stop();AC.close()},600)}catch(e){}let f=document.getElementById('flash'),b=document.getElementById('bolt');f.classList.remove('flashShow');void f.offsetWidth;f.classList.add('flashShow');b.style.display='block';setTimeout(()=>b.style.display='none',600);document.body.style.background='#fff';setTimeout(()=>document.body.style.background='#000',250)}
const cv=document.getElementById('fx'),ctx=cv.getContext('2d');function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();let ps=[],mode='fire';for(let i=0;i<150;i++)ps.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*4+2,sp:Math.random()*4+1.5});function startFX(m){mode=m;cv.style.display='block';(function loop(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.y+=p.sp;if(p.y>cv.height){p.y=-10;p.x=Math.random()*innerWidth}if(mode==='snow')ctx.fillStyle='#fff';else ctx.fillStyle=Math.random()>0.5?'#ff5500':'#ffaa00';ctx.shadowBlur=18;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()});requestAnimationFrame(loop)})()}
function getData(){try{let h=location.hash.slice(1);if(!h)return null;return JSON.parse(decodeURIComponent(h))}catch(e){return null}}
let cnt=parseInt(localStorage.getItem('boda_count')||'1247');cnt++;localStorage.setItem('boda_count',cnt);
function renderProfile(d){let eff=d.effects||{};if(eff.snow)startFX('snow');else if(eff.fire)startFX('fire');let links='';SOCIALS.forEach(s=>{if(d.links&&d.links[s.id]){let u=d.links[s.id];if(!u.startsWith('http'))u='https://'+u;links+=`<a class="link" style="color:${s.color};border-color:${s.color}" href="${u}" target="_blank"><img src="${s.logo}">${s.name}<span style="margin-left:auto;color:#fff">↗</span></a>`}});let av=d.photo?`<img class="avatar" src="${d.photo}">`:`<div class="avatar">${(d.name||'B')[0].toUpperCase()}</div>`;let ph=d.phrase?`<div class="phrase"><span>${d.phrase} • ${d.phrase} • ${d.phrase}</span></div>`:'';let musicHtml=eff.music?`<audio controls autoplay loop style="width:100%"><source src="${d.musicLink||'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'}"></audio>`:'';let videoHtml=eff.video&&d.videoLink?`<video controls autoplay muted loop style="width:100%;border-radius:16px"><source src="${d.videoLink}"></video>`:'';document.getElementById('app').innerHTML=`<div class="logo">BODA <span>LINKS</span></div><div class="counter">🔥 ${cnt} People Used Boda Links</div><div style="font-size:55px;text-align:center">✅</div><h2 style="text-align:center">Tamam! Your Page Is Ready 🎉</h2>${av}${ph}<h1 style="text-align:center">${d.name}</h1><p style="text-align:center;color:#ccc">${d.bio||''}</p>${musicHtml}${videoHtml}${links}<button class="btn elecBtn" onclick="boomElectric()">⚡ دوس هنا للكهربا - ELECTRIC ⚡</button><p style="text-align:center;font-size:13px;color:#aaa">دوس على الزرار اللي فوق، الشاشة هتنور وهتسمع صوت الكهربا</p><button class="btn btn2" onclick="navigator.clipboard.writeText(location.href);alert('Copied!')">Copy Link - انسخ الرابط 🔗</button><button class="btn" onclick="location.hash='';location.reload()">اعمل صفحتك انت كمان 🔥</button><p style="text-align:center;margin-top:10px">عايز صفحة زي دي؟ اعمل صفحتك مجانا في Boda Links</p>`}
function onPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(){userPhoto=r.result;let p=document.getElementById('preview');p.src=userPhoto;p.style.display='block'};r.readAsDataURL(f)}
function showBuilder(){let rows=SOCIALS.map(s=>`<div class="row" style="border-color:${s.color}"><input type="checkbox" style="width:22px;height:22px"><img src="${s.logo}"><b style="color:${s.color}">${s.name}</b></div><input id="in-${s.id}" style="display:none" placeholder="Put your ${s.name} link">`).join('');let vibes=VIBES.map(v=>`<div class="row"><input type="checkbox" id="v-${v.id}" style="width:22px;height:22px"><span style="font-size:26px">${v.icon}</span><b>${v.name}</b></div>`).join('');let phOpts=PHRASES.map(p=>`<option value="${p}">${p}</option>`).join('');document.getElementById('app').innerHTML=`<div class="logo">BODA <span>LINKS</span></div><p style="text-align:center">Your Links - One Page - Free</p><div class="counter">🔥 ${cnt} People Used Boda Links</div><div class="card"><h2 style="text-align:center">Create Your Page</h2><label>Your Name - اسمك</label><input id="name" placeholder="Ex: Boda"><label>Bio</label><input id="bio" placeholder="Ex: All my links here"><label>Your Photo - صورتك 📸</label><div class="upload"><p>دوس هنا واختار صورتك من الموبايل</p><input type="file" accept="image/*" onchange="onPhoto(event)"><img id="preview" class="preview"></div><label style="font-weight:900;margin-top:12px;display:block">Choose Your Phrase - اختار جملة التفاخر 💚:</label><select id="phrase"><option value="">من غير جملة</option>${phOpts}</select><p style="font-size:12px;color:#00ff88">الجملة هتتحرك تحت صورتك وتنور اخضر</p><label style="font-weight:900;display:block">1. Choose Your Socials:</label>${rows}<label style="font-weight:900;display:block;color:#00e5ff">2. Choose Your Vibe - اختار الإثارة:</label>${vibes}<label>Music Link (optional)</label><input id="musicLink" placeholder="Paste music link"><label>Video Link (optional)</label><input id="videoLink" placeholder="Paste video link"><button class="btn" onclick="makePage()">Create My Page - اعمل صفحتي 🚀</button><div id="out"></div></div>`;document.querySelectorAll('.row input[type=checkbox]').forEach((c,i)=>{if(i<SOCIALS.length){c.onchange=function(){let id=SOCIALS[i].id;document.getElementById('in-'+id).style.display=this.checked?'block':'none'}}})}
function makePage(){let name=document.getElementById('name').value||'My Page';let bio=document.getElementById('bio').value||'';let phrase=document.getElementById('phrase').value||'';let musicLink=document.getElementById('musicLink').value||'';let videoLink=document.getElementById('videoLink').value||'';let links={};SOCIALS.forEach(s=>{let v=document.getElementById('in-'+s.id).value.trim();if(v)links[s.id]=v});let effects={};VIBES.forEach(v=>{effects[v.id]=document.getElementById('v-'+v.id).checked});let hash='#'+encodeURIComponent(JSON.stringify({name,bio,photo:userPhoto,links,effects,phrase,musicLink,videoLink}));let full=location.origin+location.pathname+hash;document.getElementById('out').innerHTML=`<div style="background:#0f2a1a;padding:12px;border-radius:12px;margin-top:12px;text-align:center"><div style="font-size:40px">✅</div><b>تمام! خلصت!</b><p style="word-break:break-all;font-size:12px">${full}</p><button class="btn btn2" onclick="navigator.clipboard.writeText('${full}');alert('Copied!')">Copy Link - انسخ الرابط 🔗</button><button class="btn" onclick="location.hash='${hash}';location.reload()">افتح صفحتي - Open My Page</button></div>`}
let d=getData();if(d)renderProfile(d);else showBuilder();
</script></body></html>
