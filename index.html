<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boda Links</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:system-ui}canvas{position:fixed;inset:0;pointer-events:none;z-index:0}.wrap{max-width:480px;margin:auto;padding:18px;position:relative;z-index:1}.logo{text-align:center;font-size:34px;font-weight:900}.logo span{color:#00e5ff}.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #00e5ff;display:block;margin:12px auto}.link{display:flex;gap:12px;background:#141414;padding:15px;border-radius:16px;margin:10px 0;color:#fff;text-decoration:none;font-weight:800}.btn{background:#00e5ff;color:#000;border:0;padding:15px;border-radius:16px;width:100%;font-weight:900;font-size:17px;margin-top:10px}.btn2{background:#fff}.card{background:#141414;border:1px solid #333;border-radius:18px;padding:16px}.counter{background:linear-gradient(90deg,#ff0055,#ffaa00);padding:12px;border-radius:14px;text-align:center;font-weight:900;margin:12px 0}input{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#0a0a0a;color:#fff;margin:6px 0}.row{background:#1c1c1c;padding:10px;margin:8px 0;border-radius:14px}</style></head><body><canvas id="fx"></canvas><div class="wrap" id="app"></div><script>
const SOCIALS=[{id:'tiktok',name:'TikTok',icon:'🎵'},{id:'instagram',name:'Instagram',icon:'📸'},{id:'facebook',name:'Facebook',icon:'👍'},{id:'whatsapp',name:'WhatsApp',icon:'💬'},{id:'youtube',name:'YouTube',icon:'▶️'},{id:'snapchat',name:'Snapchat',icon:'👻'},{id:'telegram',name:'Telegram',icon:'✈️'},{id:'x',name:'X - Twitter',icon:'𝕏'}];
const cv=document.getElementById('fx'),ctx=cv.getContext('2d');let W,H,ps=[];function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();for(let i=0;i<70;i++)ps.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*3+1,sp:Math.random()*2+1,c:Math.random()>0.5?'#ff5500':'#00e5ff'});(function loop(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.y+=p.sp;if(p.y>H)p.y=-10,p.x=Math.random()*W;ctx.fillStyle=p.c;ctx.shadowBlur=10;ctx.shadowColor=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()});requestAnimationFrame(loop)})();
function getData(){try{let h=location.hash.slice(1);if(!h)return null;return JSON.parse(decodeURIComponent(h))}catch(e){return null}}
let cnt=parseInt(localStorage.getItem('boda_count')||'1247');cnt++;localStorage.setItem('boda_count',cnt);
function renderProfile(d){let links='';SOCIALS.forEach(s=>{if(d.links&&d.links[s.id]){let u=d.links[s.id];if(!u.startsWith('http'))u='https://'+u;links+=`<a class="link" href="${u}" target="_blank">${s.icon} ${s.name} <span style="margin-left:auto">↗</span></a>`}});let img=d.photo||'https://i.pravatar.cc/300';document.getElementById('app').innerHTML=`<div class="logo">BODA <span>LINKS</span></div><div class="counter">🔥 ${cnt} People Used Boda Links</div><div style="font-size:60px;text-align:center">✅</div><h2 style="text-align:center">Tamam! Your Page Is Ready 🎉</h2><img class="avatar" src="${img}"><h1 style="text-align:center">${d.name}</h1><p style="text-align:center;color:#bbb">${d.bio||''}</p>${links}<button class="btn btn2" onclick="navigator.clipboard.writeText(location.href);alert('Copied!')">Copy My Link 🔗</button><button class="btn" onclick="location.hash='';location.reload()">Create Your Page Too ✨</button>`}
function showBuilder(){let rows=SOCIALS.map(s=>`<div class="row"><label><input type="checkbox" style="width:20px"> ${s.icon} <b>${s.name}</b></label><input id="in-${s.id}" placeholder="Put your ${s.name} link"></div>`).join('');document.getElementById('app').innerHTML=`<div class="logo">BODA <span>LINKS</span></div><div class="counter">🔥 ${cnt} People Used Boda Links</div><div class="card"><h2>Create Your Page</h2><input id="name" placeholder="Your Name - Ex: Boda"><input id="bio" placeholder="Bio"><input id="photoUrl" placeholder="Paste photo link https://..."><input type="file" id="photoFile" accept="image/*"><p style="font-size:12px;color:#aaa">If you upload photo, it shows for you. For friends to see it, paste photo link.</p>${rows}<button class="btn" onclick="makePage()">Create My Page 🚀</button><div id="out"></div></div>`;document.getElementById('photoFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{window._photo=r.result;alert('Photo added!')};r.readAsDataURL(f)})}
function makePage(){let name=document.getElementById('name').value||'My Page';let bio=document.getElementById('bio').value||'';let photo=document.getElementById('photoUrl').value||window._photo||'';let links={};SOCIALS.forEach(s=>{let v=document.getElementById('in-'+s.id).value.trim();if(v)links[s.id]=v});let hash='#'+encodeURIComponent(JSON.stringify({name,bio,photo,links}));document.getElementById('out').innerHTML=`<div style="background:#0f2a1a;padding:12px;border-radius:12px;margin-top:12px"><div style="font-size:40px;text-align:center">✅</div><b>Tamam! Done!</b><p style="word-break:break-all;font-size:12px">${location.origin+location.pathname+hash}</p><button class="btn btn2" onclick="navigator.clipboard.writeText('${location.origin+location.pathname+hash}');alert('Copied!')">Copy Link</button><button class="btn" onclick="location.hash='${hash}';location.reload()">Open My Page</button></div>`}
let d=getData();if(d)renderProfile(d);else document.getElementById('app').innerHTML=`<div class="logo">BODA <span>LINKS</span></div><div class="counter">🔥 ${cnt} People Used Boda Links</div><img class="avatar" src="https://i.pravatar.cc/300"><h1 style="text-align:center">Boda</h1><p style="text-align:center">Welcome To My Page ❤️</p><a class="link" href="https://tiktok.com">🎵 TikTok</a><a class="link" href="https://instagram.com">📸 Instagram</a><a class="link" href="https://telegram.org">✈️ Telegram</a><a class="link" href="https://x.com">𝕏 X - Twitter</a><button class="btn" onclick="showBuilder()">Create Your Page Free ✨</button>`;
</script></body></html>
